[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cver-full-pipeline"
version = "0.2.0"
description = "Evidence-gated container vulnerability evaluation and autonomous discovery pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "pypdf>=5.0,<7",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "openai>=1.100,<3",
  "jsonschema>=4.22,<5",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
cver = "cver.cli:main"
cver-discovery-worker = "cver.discovery.worker:main"

[tool.setuptools.packages.find]
include = ["cver*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
