{
  "profile": "local",
  "storage": {
    "db_path": "data/cver_full_pipeline.db",
    "output_dir": "outputs/runs"
  },
  "scanner": {
    "backend_priority": [
      "real-cli",
      "dry-run",
      "mock"
    ],
    "use_demo_data": false,
    "trivy_skip_db_update": false
  },
  "llm": {
    "provider": "mock",
    "mode": "hybrid"
  },
  "rag": {
    "mode": "keyword-rag"
  },
  "redteam": {
    "execution_level": "dry-run",
    "require_human_confirm": true
  },
  "repair": {
    "safe_apply": false,
    "require_human_confirm": true
  },
  "policy": {
    "require_lab_label": true,
    "allow_public_targets": false
  }
}